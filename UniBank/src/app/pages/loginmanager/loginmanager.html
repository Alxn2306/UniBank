<div class="login-container">
  <!-- Lado izquierdo -->
  <div class="form-section">
    <!-- Logo -->
    <div class="logo">
      <img src="Iconos/Unibank.png" alt="Logo" class="logo-img" />
      <span class="title">
        <span class="ub">UB</span><span class="unibank">unibank</span>
      </span>
    </div>

    <!-- Bienvenida -->
    <h2>¡Bienvenido Manager!</h2>
    <p>Accede al panel de administración principal.</p>

    <!-- Mensaje de error -->
    <div class="error-message" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <!-- Formulario -->
    <form (ngSubmit)="onLogin()" #loginForm="ngForm">
      <div class="form-group">
        <label for="email">Correo</label>
        <input 
          type="email" 
          id="email" 
          name="correo"
          placeholder="Ingresa tu email de manager" 
          [(ngModel)]="loginData.correo"
          required 
          email
        />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <div class="password-field">
          <input 
            type="password" 
            id="password" 
            name="contrasena"
            placeholder="Ingresa tu contraseña" 
            [(ngModel)]="loginData.contrasena"
            required 
          />
          <a href="#">Olvidé mi contraseña</a>
        </div>
      </div>

      <!-- Botón de iniciar sesión -->
      <button 
        type="submit" 
        class="login-btn manager-btn" 
        [disabled]="loading || !loginForm.valid"
      >
        <span *ngIf="!loading">Acceder como Manager</span>
        <span *ngIf="loading">Verificando credenciales...</span>
      </button>
    </form>

    <!-- Volver al inicio -->
    <p class="back-link">
      <a routerLink="/">← Volver al inicio</a>
    </p>
  </div>

  <!-- Lado derecho (imagen) -->
  <div class="image-section">
    <img src="Imagenes/bank.png" alt="Banco digital" />
    <div class="role-badge manager">
      <span>Manager General</span>
    </div>
  </div>
</div>
