<div class="app-container">
  <!-- Sidebar -->
  <aside class="sidebar">
    <img src="Iconos/Unibank.png" alt="Logo" class="logo" />
    <a routerLink="clientes" class="btn" routerLinkActive="active">
      <img src="Iconos/clientes.png" alt="Clientes" />
      <span>Clientes</span>
    </a>

    <a routerLink="creditos" class="btn" routerLinkActive="active">
      <img src="Iconos/creditos.png" alt="Creditos" />
      <span>Creditos</span>
    </a>

    <a routerLink="prestamos" class="btn" routerLinkActive="active">
      <img src="Iconos/prestamos2.png" alt="Prestamos" />
      <span>Prestamos</span>
    </a>

    <a routerLink="transferencias" class="btn" routerLinkActive="active">
      <img src="Iconos/transferencias2.png" alt="Transferencias" />
      <span>Transferencias</span>
    </a>

    <!-- Espaciador para empujar el logout abajo -->
    <div class="sidebar-spacer"></div>

    <!-- Cerrar sesión -->
    <a (click)="logout()" class="btn">
      <img src="Iconos/cerrars.png" alt="Cerrar sesión" />
      <span>Cerrar sesión</span>
    </a>
  </aside>

  <!-- Contenido principal -->
  <div class="main-content">
    <header class="header">
      <img src="Iconos/Unibank2.png" alt="Logo" class="logo" />
      <div class="user-icon">
        <img src="Imagenes/USUARIO.jpg" alt="Usuario" />
      </div>
    </header>

    <main>
      <div class="page-content">
        <router-outlet></router-outlet>
      </div>
    </main>
  </div>
</div>
