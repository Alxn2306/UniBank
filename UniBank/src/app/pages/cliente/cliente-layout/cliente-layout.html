<div class="app-container">
  <!-- Sidebar -->
  <aside class="sidebar">
    <a routerLink="micuenta" class="btn" routerLinkActive="active">
      <img src="Iconos/micuenta.png" alt="Mi cuenta" />
      <span>Mi cuenta</span>
    </a>

    <a routerLink="transferencias" class="btn" routerLinkActive="active">
      <img src="Iconos/transferencias.png" alt="Transferencias" />
      <span>Transferencias</span>
    </a>

    <a routerLink="movimientos" class="btn" routerLinkActive="active">
      <img src="Iconos/movimientos.png" alt="Movimientos" />
      <span>Movimientos</span>
    </a>

    <a routerLink="credito" class="btn" routerLinkActive="active">
      <img src="Iconos/credito.png" alt="Crédito" />
      <span>Crédito</span>
    </a>

    <a routerLink="prestamos" class="btn" routerLinkActive="active">
      <img src="Iconos/prestamos.png" alt="Préstamos" />
      <span>Préstamos</span>
    </a>

    <!-- Espaciador para empujar el logout abajo -->
    <div class="sidebar-spacer"></div>

    <!-- Cerrar sesión -->
    <a (click)="logout()" class="btn">
      <img src="Iconos/cerrars.png" alt="Cerrar sesión" />
      <span>Cerrar sesión</span>
    </a>
  </aside>

  <!-- Contenido principal -->
  <div class="main-content">
    <header class="header">
      <img src="Iconos/Unibank2.png" alt="Logo Unibank" class="logo" />
      <div class="user-icon">
        <img src="Imagenes/USUARIO.jpg" alt="Usuario" />
      </div>
    </header>

    <main>
      <div class="page-content">
        <!-- Aquí va el contenido específico de cada página -->
        <router-outlet></router-outlet>
      </div>
    </main>
  </div>
</div>
