<div class="app-container">
  <!-- Sidebar -->
  <aside class="sidebar">
     <img src="Iconos/Unibank.png" alt="Logo" class="logo" />
    <a routerLink="datoscliente" class="btn" routerLinkActive="active">
      <img src="Iconos/datoscliente.png" alt="Datos de clientes" />
      <span>Datos de clientes</span>
    </a>

    <a routerLink="datoscredito" class="btn" routerLinkActive="active">
      <img src="Iconos/datoscreditos.png" alt="Datos de creditos" />
      <span>Datos de creditos</span>
    </a>

    <a routerLink="datoscuenta" class="btn" routerLinkActive="active">
      <img src="Iconos/datoscuentas.png" alt="Datos de cuentas" />
      <span>Datos de cuentas</span>
    </a>

    <!-- Espaciador para empujar el logout abajo -->
    <div class="sidebar-spacer"></div>

    <!-- Cerrar sesión -->
    <a (click)="logout()" class="btn logout-btn">
      <img src="Iconos/cerrars.png" alt="Cerrar sesión" />
      <span>Cerrar sesión</span>
    </a>
  </aside>

  <!-- Contenido principal -->
  <div class="main-content">
    <header class="header">
      <img src="Iconos/Unibank2.png" alt="Logo" class="logo" />
      <div class="user-icon">
        <img src="Imagenes/USUARIO.jpg" alt="Usuario" />
      </div>
    </header>

    <main>
      <div class="page-content">
        <router-outlet></router-outlet>
      </div>
    </main>
  </div>
</div>
