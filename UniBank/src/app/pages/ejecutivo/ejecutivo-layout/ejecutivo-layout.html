<div class="app-container">
  <!-- Sidebar -->
  <aside class="sidebar">

    <!-- Cambia href por routerLink con rutas relativas -->
    <a routerLink="datoscliente" class="btn" routerLinkActive="active">
      <img src="Iconos/datoscliente.png" alt="Datos de clientes" />
      Datos de clientes
    </a>

    <a routerLink="datoscredito" class="btn" routerLinkActive="active">
      <img src="Iconos/datoscreditos.png" alt="Datos de creditos" />
      Datos de creditos
    </a>

    <a routerLink="datoscuenta" class="btn" routerLinkActive="active">
      <img src="Iconos/datoscuentas.png" alt="Datos de cuentas" />
      Datos de cuentas
    </a>

    <!-- Para cerrar sesión -->
    <a (click)="logout()" class="btn" style="cursor: pointer;">
      <img src="Iconos/cerrars.png" alt="Cerrar sesión" />
      Cerrar sesión
    </a>
  </aside>

  <!-- Contenido principal -->
  <div class="main-content">
    <header class="header">
      <img src="Iconos/Unibank2.png" alt="Logo" class="logo" />
      <div class="user-icon">
        <img src="Imagenes/USUARIO.jpg" alt="Usuario" />
      </div>
    </header>

    <main>
      <!-- Aquí se renderiza el hijo activo -->
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
