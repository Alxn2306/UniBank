<div class="login-container">
  <div class="form-section">
    <!-- Logo -->
    <div class="logo">
      <img src="Iconos/Unibank.png" alt="Logo" class="logo-img" />
      <span class="title">
        <span class="ub">UB</span><span class="unibank">unibank</span>
      </span>
    </div>

    <!-- Contenedor principal de pasos -->
    <div class="pasos-container">
      <!-- PASO 1: Solicitar código -->
      <div *ngIf="paso === 1" class="paso-1">
        <h2>Recuperar Contraseña</h2>
        <p>Te enviaremos un código de verificación a tu correo.</p>

        <div class="form-group">
          <label>Correo Electrónico</label>
          <input 
            type="email" 
            [(ngModel)]="correo" 
            placeholder="tu@correo.com"
            [disabled]="loading"
          />
        </div>

        <button 
          (click)="solicitarCodigo()" 
          [disabled]="loading"
          class="login-btn">
          {{ loading ? 'Enviando...' : 'Enviar Código' }}
        </button>
      </div>

      <!-- PASO 2: Verificar código y cambiar contraseña -->
      <div *ngIf="paso === 2" class="paso-2">
        <h2>Verificar Código</h2>
        <p>Revisa tu correo <strong>{{ correo }}</strong></p>

        <div class="form-group">
          <label>Código de 6 dígitos</label>
          <input 
            type="text" 
            [(ngModel)]="codigo" 
            placeholder="123456"
            maxlength="6"
            [disabled]="loading"
          />
        </div>

        <div class="form-group">
          <label>Nueva Contraseña</label>
          <input 
            type="password" 
            [(ngModel)]="nuevaContrasena" 
            placeholder="Mínimo 6 caracteres"
            [disabled]="loading"
          />
        </div>

        <button 
          (click)="cambiarPassword()" 
          [disabled]="loading"
          class="login-btn">
          {{ loading ? 'Cambiando...' : 'Cambiar Contraseña' }}
        </button>
      </div>
    </div>

    <!-- Mensaje -->
    <div *ngIf="mensaje" 
         [ngClass]="{'error-message': error, 'success-message': !error}">
      {{ mensaje }}
    </div>

    <!-- Volver al login -->
    <p class="register-link">
      <a [routerLink]="['/logincliente']">← Volver al inicio de sesión</a>
    </p>
  </div>

  <!-- Imagen -->
  <div class="image-section">
    <img src="Imagenes/imagenlogin.png" alt="Recuperación" />
  </div>
</div>
