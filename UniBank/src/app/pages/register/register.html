<div class="register-container">
  <div class="form-section">
    <div class="logo">
      <img src="Iconos/Unibank.png" alt="Logo" class="logo-img" />
      <span class="title">
        <span class="ub">UB</span><span class="unibank">unibank</span>
      </span>
    </div>

    <h2>Crear cuenta</h2>

    <form (ngSubmit)="registrarUsuario()">
      <input type="text" [(ngModel)]="nombre_usuario" name="nombre_usuario" placeholder="Nombre completo" required />
      <input type="tel" [(ngModel)]="telefono" name="telefono" placeholder="Número de celular" required />
      <input type="email" [(ngModel)]="correo" name="correo" placeholder="Correo electrónico" required />
      <input type="password" [(ngModel)]="contrasena" name="contrasena" placeholder="Contraseña" required />

      <label class="terms">
        <input type="checkbox" required />
        Acepto los términos y políticas
      </label>

      <button type="submit" class="register-btn" [disabled]="loading">
        {{ loading ? 'Registrando...' : 'Registrar' }}
      </button>
    </form>
  </div>

  <div class="image-section">
    <img src="Imagenes/bank.png" alt="Banco digital" />
  </div>
</div>
